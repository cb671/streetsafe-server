services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: streetsafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streetsafe"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/streetsafe
      VALHALLA_URL: http://valhalla:8002
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: "${VALHALLA_TILE_URL:-}"
      server_threads: "${VALHALLA_THREADS:-2}"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla-data:/custom_files
    restart: unless-stopped

volumes:
  postgres-data:
